          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"
        ]
      interval: 10s
      timeout: 5s
      retries: 5

    networks:
      - automation-net
      
      
  subtitle-api:
    build:
      context: ./subtitle-api
